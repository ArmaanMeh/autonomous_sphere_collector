# Controller Manager configuration
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    # Definition of the controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    scoop_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ----------------------------------------------------------------
# 1. Joint State Broadcaster
# ----------------------------------------------------------------
# Publishes the state of all joints to /joint_states
joint_state_broadcaster:
  ros__parameters: {}

# ----------------------------------------------------------------
# 2. Differential Drive Controller (Wheels)
# ----------------------------------------------------------------
diff_drive_controller:
  ros__parameters:
    # Joint names must match your XACRO exactly
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    command_interfaces:
      - velocity

    state_interfaces:
      - velocity
      - position

    # Robot Kinematics (Based on your XACRO properties)
    wheel_separation: 0.47 
    wheel_radius: 0.1

    # Odometry and Publishing
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint 
    cmd_vel_topic: cmd_vel
    
    # Motion constraints
    cmd_vel_timeout: 0.5
    use_stamped_vel: false # Set to true if your cmd_vel uses TwistStamped

    # Covariance for EKF/Localization
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

# ----------------------------------------------------------------
# 3. Scoop Controller (Tilt Mechanism)
# ----------------------------------------------------------------
scoop_controller:
  ros__parameters:
    # The main revolute joint we defined in scoop_mechanism.xacro
    joints:
      - scoop_pivot_joint

    # Must match the hardwareInterface in your XACRO transmission
    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # Smooth the motion
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    # Safety constraints to prevent the scoop from overshooting
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.02
      scoop_pivot_joint:
        trajectory: 0.10
        goal: 0.02