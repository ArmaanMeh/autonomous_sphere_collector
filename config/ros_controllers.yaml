controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    # Define the controllers and their types
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    scoop_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ----------------------------------------------------------------
# Controller Specific Parameters (top-level siblings)
# ----------------------------------------------------------------

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["base_left_wheel_joint"]
    right_wheel_names: ["base_right_wheel_joint"]
    wheel_separation: 0.45
    wheel_radius: 0.1

    # Optional tuning multipliers
    wheel_separation_multiplier: 1.0
    wheel_radius_multiplier: 1.0

    cmd_vel_timeout: 0.5
    publish_rate: 50.0
    use_stamped_vel: true
    base_frame_id: base_link
    odom_frame_id: odom   # Added for clarity

joint_state_broadcaster:
  ros__parameters: {}

scoop_controller:
  ros__parameters:
    joints:
      - scoop_left_wing_joint

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false

    # Optional constraints for smoother simulation
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.01
      scoop_left_wing_joint:
        goal: 0.05
