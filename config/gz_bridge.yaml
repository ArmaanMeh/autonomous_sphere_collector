# =================================================================
# ROS-GZ Bridge Configuration (Pure Gazebo Control)
# Maps ROS 2 topics to Gazebo Transport topics for ROS 2 Jazzy & Gazebo Harmonic
# =================================================================

# --- 1. Clock (Simulation Time Synchronization) ---
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: "GZ_TO_ROS"

# --- 2. Joint States (Wheel spins and Scoop Position Feedback) ---
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states" 
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: "GZ_TO_ROS"

# --- 3. Base Mobility Command (Driving the 4 Wheels) ---
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: "ROS_TO_GZ"
  
# --- 4. Odometry (Robot Track Feedback) ---
- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: "GZ_TO_ROS"

# --- 5. Scoop Pivot Position Controller Command ---
# Updated to match the relative topic namespace 'scoop_cmd_pos' 
# defined in your teleop script and Gazebo JointPositionController URDF plugin.
- ros_topic_name: "scoop_cmd_pos"
  gz_topic_name: "scoop_cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: "ROS_TO_GZ"

# --- 6. 2D Lidar Scan Data ---
- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: "GZ_TO_ROS"

# --- 7. IMU Sensor Array Data ---
- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: "GZ_TO_ROS"