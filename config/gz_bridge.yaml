# =================================================================
# ROS-GZ Bridge Configuration (Pure Gazebo Control)
# Maps ROS 2 topics to Gazebo Transport topics for ROS 2 Jazzy & Gazebo Harmonic
# =================================================================

# --- 1. Clock is sourced directly by Gazebo / ros_gz_bridge; do not bridge it
#     twice or robot_state_publisher will see non-monotonic timestamps and spam
#     'Moved backwards in time' warnings.

# --- 2. Joint States (Wheel spins and Scoop Position Feedback) ---
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states" 
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: "GZ_TO_ROS"

# --- 3. Base Mobility Command (Driving the 4 Wheels) ---
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: "ROS_TO_GZ"
  
# --- 4. Odometry (Robot Track Feedback) ---
- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: "GZ_TO_ROS"

# --- 5. Odometry TF (Required by SLAM Toolbox) ---
- ros_topic_name: "tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: "GZ_TO_ROS"

# --- 6. Scoop Pivot Position Controller Command ---
- ros_topic_name: "scoop_cmd_pos"
  gz_topic_name: "scoop_cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: "ROS_TO_GZ"

# --- 7. 2D Lidar Scan Data ---
- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: "GZ_TO_ROS"

# --- 8. IMU Sensor Array Data ---
- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: "GZ_TO_ROS"

# 🟢 --- 9. RGBD Camera: Raw Color Image Feed ---
- ros_topic_name: "camera/image_raw"
  gz_topic_name: "camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: "GZ_TO_ROS"

# 🟢 --- 10. RGBD Camera: Lens Matrix Info Calibration Profile ---
- ros_topic_name: "camera/camera_info"
  gz_topic_name: "camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: "GZ_TO_ROS"

# 🟢 --- 11. RGBD Camera: Depth Matrix Array Visual Feed ---
- ros_topic_name: "camera/depth_image"
  gz_topic_name: "camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: "GZ_TO_ROS"

# 🟢 --- 12. RGBD Camera: 3D Point Cloud Voxel Projection ---
- ros_topic_name: "camera/points"
  gz_topic_name: "camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloud2"
  direction: "GZ_TO_ROS"